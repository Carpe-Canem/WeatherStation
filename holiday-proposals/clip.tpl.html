<!doctype html><meta charset="utf-8"><pre id="out"></pre><script>
/*BIGLIFT*/
/*ENGINE*/
// The pose-grid clip test. Renders each dog with each design (?src=designs, the default: DESIGNS through the
// stamping hook) or each approved outfit (?src=outfits: OUTFITS through render's own parts argument, the code
// path that ships) over a grid of poses, on an engine whose LIFT is much bigger than the real one, and reports:
//   lift   the LIFT (whole sprite pixels of headroom) the dog needs so nothing reaches the canvas top
//   worst  the pose that needs it
//   right  the WIDE (whole columns at the right) the dog needs: how far past 72 * SIZE the outfit reaches,
//          beyond the bare dog in the same pose
//   edges  left/bottom edges the outfit touches in a pose where the bare dog doesn't (width has no LIFT)
const { render, box, LIFT, SIZE } = Sprites, BIG = LIFT; // the measuring engine's LIFT and WIDE are both BIG
const src = new URLSearchParams(location.search).get('src') || 'designs';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// heldPose from app/js/dogs.js, with the finger-swing ear offset g.fvx swept over its whole range.
function heldPose(k, t, ear) {
  if (k === 'z') return { ph: t * 16, amp: 0.55, legF: -0.15, legB: 0.15, mouth: 1, head: -0.12, ear: 0.2 + ear, tail: t * 22 };
  if (k === 'f') return { legF: 0.55, legB: -0.6, head: 0.1, ear: -0.4 + ear, tail: Math.sin(t * 9) * 0.4 };
  return { legF: -0.3, legB: 0.35, head: 0.38, eyes: Math.sin(t * 1.3) > 0.8 ? 1 : 0, ear: -0.35 + ear, tail: t };
}
const gait = (t, fast, k) => { const ph = t * (fast ? 22 : 11) * (k === 'm' ? 1.1 : 1); return { ph, amp: fast ? 0.75 : 0.45, bob: -Math.abs(Math.sin(ph)) * (fast ? 1.5 : 0.8) }; };
function poses(k) {
  const P = [];
  for (const sit of [0, 0.25, 0.5, 0.75, 1]) for (let i = 0; i <= 12; i++) for (let y = 0; y >= -7; y--) {
    const head = Math.min(0.65, -0.53 + i * 0.1);
    P.push([`sit ${sit} head ${head.toFixed(2)} y ${y}`, { sit, head, y }]);
  }
  P.push(['lie', { lie: 1, head: 0.32, eyes: 0 }], ['lie, looking up', { lie: 1, head: -0.3 }]);
  for (let t = 0; t < 0.14; t += 0.0175) P.push(['shake', { shake: 1, t }]);
  for (let t = 0; t < 0.2; t += 0.02) P.push(['scratch', { sit: 1, scratch: 1, head: 0.15, t }]);
  for (const ear of [-0.5, 0, 0.5]) for (const t of [0, 0.3, 0.7, 1.1]) P.push(['held', heldPose(k, t, clamp(ear, -0.5, 0.5))]);
  for (const ear of [-0.7, -0.4, 0.2, 0.4]) P.push(['ear ' + ear, { ear }], ['sitting up, ear ' + ear, { sit: 1, head: -0.53, ear }]);
  for (let t = 0; t < 0.6; t += 0.05) P.push(['walk', gait(t, 0, k)], ['run', { ...gait(t, 1, k), mouth: 1, ear: -0.3 }]);
  if (k === 'z') {
    P.push(['pounce', { y: -16 }], ['pounce peak', { y: -16, head: 0.35, legF: 0.6, legB: -0.5 }], ['pounce crouch', { bow: 0.18, ear: -0.25, head: 0.1 }], ['pounce landing', { bow: 0.35, head: 0.6, ear: -0.1 }]);
    for (let v = 0; v <= 1; v += 0.1) P.push(['pounce arc', { y: -Math.sin(v * Math.PI) * 16, head: 0.2 + v * 0.3, legF: 0.6, legB: -0.5 }]);
  }
  return P;
}
function extent(k, parts, pose, ctx, b) {
  if (src === 'designs') { Sprites.HOOK.stamp = parts ? (kk, p, d, mask, w, h, X) => parts.forEach(pt => stampPart(pt, X, d, mask, w, h)) : null; render(k, { t: 0, tail: 0, ...pose }, ctx); }
  else { Sprites.HOOK.stamp = null; render(k, { t: 0, tail: 0, ...pose }, ctx, parts || undefined); }
  const d = ctx.getImageData(0, 0, b.w, b.h).data;
  let top = b.h, left = b.w, right = -1, bottom = -1;
  for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) if (d[(y * b.w + x) * 4 + 3]) { if (y < top) top = y; if (y > bottom) bottom = y; if (x < left) left = x; if (x > right) right = x; }
  return { top, left, right, bottom };
}
const res = { src, bare: {}, designs: {} };
for (const k of 'zfm') {
  const b = box(k), cv = document.createElement('canvas'); cv.width = b.w; cv.height = b.h;
  const ctx = cv.getContext('2d', { willReadFrequently: true }), P = poses(k);
  const bare = P.map(([, p]) => extent(k, null, p, ctx, b));
  const worstOf = ex => { let i = 0; ex.forEach((e, j) => { if (e.top < ex[i].top) i = j; }); return i; };
  const wb = worstOf(bare);
  res.bare[k] = { lift: BIG[k] - bare[wb].top, worst: P[wb][0] };
  const list = [];
  if (src === 'designs') { for (const [h, dogs] of Object.entries(DESIGNS)) for (const o of dogs[k] || []) list.push([h, o.id, o.parts]); }
  else for (const [h, dogs] of Object.entries(OUTFITS)) if (dogs[k]) list.push([h, k, dogs[k].parts]);
  for (const [h, id, parts] of list) {
    const ex = P.map(([, p]) => extent(k, parts, p, ctx, b)), w = worstOf(ex), edges = [], W = Math.ceil(72 * SIZE[k]);
    let right = 0, rightPose = '';
    ex.forEach((e, i) => {
      const over = Math.max(0, e.right - Math.max(W - 1, bare[i].right));
      if (over > right) { right = over; rightPose = P[i][0]; }
      if (e.left === 0 && bare[i].left > 0) edges.push('left: ' + P[i][0]);
      if (e.bottom === b.h - 1 && bare[i].bottom < b.h - 1) edges.push('bottom: ' + P[i][0]);
    });
    (res.designs[h] ||= {})[id] = { dog: k, lift: BIG[k] - ex[w].top, worst: P[w][0], right, rightPose, edges: [...new Set(edges)].slice(0, 6) };
  }
}
document.getElementById('out').textContent = JSON.stringify(res);
</script>
