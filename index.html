<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backyard Weather</title>
<meta name="description" content="A cleaner dashboard for a home weather station.">
<meta name="theme-color" content="#9ed3f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101a33" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Backyard">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
  // A Home Screen app on iPhone has its own storage, apart from Safari's, and opens the manifest's
  // start_url. Opened from a share link (?station=…&key=…), leave the manifest out so iOS saves this
  // exact address instead, and the installed app connects on first launch.
  if (!/[?&]key=/.test(location.search)) document.write('<link rel="manifest" href="manifest.webmanifest">');
</script>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="icon" href="icons/icon-192.png?v=2">
<link rel="preload" href="fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<script>
  // Pick day or night before first paint so the page never flashes. Mirrors updateWorld() in app.js:
  // Night runs from 40 minutes after sunset to 40 minutes before sunrise at the last known station position.
  try {
    const s = JSON.parse(localStorage.getItem('backyard.settings.v1')) || {}, now = new Date();
    let night;
    if (s.loc) {
      const base = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
      const g = 2 * Math.PI / 365 * (Math.round((base - Date.UTC(now.getFullYear(), 0, 0)) / 864e5) - 1);
      const dec = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
      const eqt = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
      const r = s.loc.lat * Math.PI / 180, c = Math.cos(1.5853) / (Math.cos(r) * Math.cos(dec)) - Math.tan(r) * Math.tan(dec);
      const ha = Math.acos(Math.max(-1, Math.min(1, c))) * 720 / Math.PI, noon = 720 - 4 * s.loc.lon - eqt;
      const m = (now - base) / 6e4;
      night = m < noon - ha - 40 || m > noon + ha + 40;
    } else night = now.getHours() < 6 || now.getHours() >= 20;
    document.documentElement.dataset.theme = night ? 'dark' : 'light';
  } catch {}
</script>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="pack" aria-hidden="true"></div>
<header class="top">
  <div class="top-text">
    <h1 id="stationName">Backyard</h1>
    <p class="status" id="status"><span class="dot" aria-hidden="true"></span><span id="statusText">Loading</span></p>
  </div>
  <button class="icon-btn" id="refresh" type="button" aria-label="Refresh">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>
  </button>
</header>

<main>
  <div id="banner" class="banner" hidden></div>
  <section id="view-now" class="view" aria-label="Current conditions"></section>
  <section id="view-trends" class="view" aria-label="Trends" hidden></section>
  <section id="view-settings" class="view" aria-label="Settings" hidden></section>
</main>

<nav class="tabs" aria-label="Sections">
  <button type="button" data-view="now" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
    <span>Now</span>
  </button>
  <button type="button" data-view="trends">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M4 15l5-5 4 3 7-8"/></svg>
    <span>Trends</span>
  </button>
  <button type="button" data-view="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    <span>Settings</span>
  </button>
</nav>

<script type="module" src="js/app.js"></script>
</body>
</html>
